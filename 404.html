<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>找不到这一页 · 长夜拾星</title>
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#101614" />
<style>
  :root{--night:#101614;--paper:#e6ded0;--bamboo:#c2a878;--moss:#94a394;--cinnabar:#b0462c;
    --serif:"Songti SC","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--night);color:var(--paper);font-family:var(--sans);line-height:1.8;
    background-image:radial-gradient(120% 70% at 50% -10%,rgba(194,168,120,.07),transparent 60%);
    background-repeat:no-repeat}
  .box{max-width:36rem;padding:2rem clamp(1.15rem,5vw,2.25rem)}
  .slips{display:flex;border-top:1px solid rgba(194,168,120,.18);border-bottom:1px solid rgba(194,168,120,.18);margin:0 0 1.6rem}
  .slips span{flex:1;display:flex;align-items:center;justify-content:center;padding:.9rem 0;
    font-family:var(--serif);font-size:1.8rem;color:var(--bamboo)}
  .slips span + span{border-left:1px solid rgba(194,168,120,.18)}
  h1{margin:0 0 .6rem;font-family:var(--serif);font-weight:400;font-size:1.5rem}
  p{margin:0 0 .6rem;color:var(--moss)}
  a{color:var(--paper);border-bottom:1px solid rgba(194,168,120,.32);text-decoration:none}
  a:hover,a:focus-visible{color:var(--bamboo);outline:none}
  .sig{margin-top:2rem;font-family:var(--serif);letter-spacing:.2em;font-size:.9rem;color:rgba(194,168,120,.7)}
</style>
</head>
<body>
<div class="box">
  <div class="slips" aria-hidden="true"><span>长</span><span>夜</span><span>拾</span><span>星</span></div>
  <h1>这一页没有找到</h1>
  <p>地址可能拼错了，或者这一页还没写。</p>
  <p><a href="/">回到首页</a></p>
  <p class="sig">长夜拾星 · 二〇二六</p>
</div>
</body>
</html>
