<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>没有这一页 · 长夜拾星</title>
<meta name="description" content="长夜拾星 Nightglean Studio：这一页不存在。" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0c1210" />
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c1210'/%3E%3Cg fill='%23c2a878'%3E%3Crect x='5' y='6' width='4' height='20'/%3E%3Crect x='11' y='6' width='4' height='20'/%3E%3Crect x='17' y='6' width='4' height='20'/%3E%3Crect x='23' y='6' width='4' height='20'/%3E%3C/g%3E%3C/svg%3E" />
<style>
  :root{
    --night:#0c1210;
    --paper:#e7dece;
    --paper-dim:#b3aa9b;
    --bamboo:#c2a878;
    --cinnabar:#a8422b;
    --moss:#8d9d90;
    --serif:"Songti SC","Songti TC","Source Han Serif SC","Source Han Serif CN","Noto Serif SC","Noto Serif CJK SC","SimSun","STSong",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100svh;
    display:grid;
    place-items:center;
    padding:clamp(1.5rem,6vw,4rem);
    background:var(--night);
    color:var(--paper);
    font-family:var(--serif);
    line-height:1.86;
    background-image:radial-gradient(130% 72% at 50% -14%, rgba(194,168,120,.075), transparent 62%);
    background-repeat:no-repeat;
  }
  a{color:var(--paper);text-decoration:none}
  :focus-visible{outline:2px solid var(--bamboo);outline-offset:3px}
  .box{max-width:34rem;text-align:center}
  .slips{
    list-style:none;display:flex;justify-content:center;gap:clamp(.35rem,1.2vw,.62rem);
    margin:0 0 2.2rem;padding:0;position:relative;
  }
  .slips::before,.slips::after{
    content:"";position:absolute;left:0;right:0;height:1px;z-index:2;
    background:linear-gradient(90deg,transparent,rgba(194,168,120,.45) 12%,rgba(194,168,120,.45) 88%,transparent);
  }
  .slips::before{top:22%}
  .slips::after{top:74%}
  .slip{
    position:relative;width:clamp(2.9rem,10vw,4.2rem);height:clamp(8.6rem,28vw,12rem);
    background:linear-gradient(90deg, rgba(0,0,0,.42), rgba(255,255,255,.03) 26%, rgba(255,255,255,.02) 62%, rgba(0,0,0,.46)),linear-gradient(180deg,#1d2622,#141c19 46%,#101715);
    border:1px solid rgba(194,168,120,.2);border-radius:2px;
  }
  .slip--void{
    display:grid;place-items:center;
    border-style:dashed;border-color:rgba(194,168,120,.34);
    background:linear-gradient(180deg,#121917,#0f1513);
  }
  .slip--void span{font-family:var(--serif);font-size:clamp(1.2rem,4vw,1.6rem);color:rgba(168,66,43,.8)}
  .code{
    margin:0;
    font-family:var(--sans);
    font-size:.74rem;letter-spacing:.4em;text-indent:.4em;color:var(--bamboo);
  }
  h1{
    margin:.7rem 0 0;font-size:clamp(1.25rem,4.4vw,1.6rem);font-weight:400;letter-spacing:.05em;
  }
  p.lede{margin:1rem auto 0;max-width:27rem;color:var(--moss);font-size:.95rem}
  .acts{margin:2rem 0 0;display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
  .btn{
    display:inline-block;padding:.6rem 1.15rem;font-family:var(--sans);font-size:.85rem;
    color:#12100c;background:var(--bamboo);border:1px solid var(--bamboo);border-radius:1px;
    transition:background .22s ease;
  }
  .btn:hover{background:#d3ba8c}
  .btn--quiet{color:var(--paper-dim);background:transparent;border-color:rgba(194,168,120,.35)}
  .btn--quiet:hover{color:var(--paper);background:rgba(194,168,120,.09)}
  .foot{margin:2.4rem 0 0;font-family:var(--sans);font-size:.75rem;color:var(--paper-dim)}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.001ms !important}}
</style>
</head>
<body>
  <main class="box">
    <ul class="slips" aria-hidden="true">
      <li class="slip"></li>
      <li class="slip"></li>
      <li class="slip slip--void"><span>缺</span></li>
      <li class="slip"></li>
    </ul>
    <p class="code">404</p>
    <h1>这一片是空的，页面不在这里</h1>
    <p class="lede">地址可能打错了，也可能是旧链接。四个项目、做事方式和构建记录都还在首页上。</p>
    <div class="acts">
      <a class="btn" href="/">回首页</a>
      <a class="btn btn--quiet" href="https://github.com/nightglean">去组织页</a>
    </div>
    <p class="foot">长夜拾星 · 二〇二六</p>
  </main>
</body>
</html>
