<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<script>
  (function(){
    var d=document.documentElement,t=null;
    try{t=localStorage.getItem('ng.theme')}catch(e){}
    if(t!=='light'&&t!=='dark'){
      t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
    }
    d.setAttribute('data-theme',t);
    var l=null;
    try{l=localStorage.getItem('ng.lang')}catch(e){}
    if(l!=='zh'&&l!=='tw'&&l!=='en'){
      var n=(navigator.language||'zh').toLowerCase();
      l=n.indexOf('zh')===0?(/hant|tw|hk|mo/.test(n)?'tw':'zh'):'en';
    }
    d.setAttribute('lang',l==='en'?'en':(l==='tw'?'zh-Hant':'zh-CN'));
    d.setAttribute('data-lang',l);
    if(l!=='zh'){d.classList.add('i18n-wait')}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>没有这一页 · 长夜拾星</title>
<meta name="description" content="长夜拾星 Nightglean Studio：这一页不存在。" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#0c1210" />
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c1210'/%3E%3Cg fill='%23c2a878'%3E%3Crect x='5' y='6' width='4' height='20'/%3E%3Crect x='11' y='6' width='4' height='20'/%3E%3Crect x='17' y='6' width='4' height='20'/%3E%3Crect x='23' y='6' width='4' height='20'/%3E%3C/g%3E%3C/svg%3E" />
<style>
  :root{
    color-scheme:dark;
    --bg:#0c1210;
    --ink:#e7dece;
    --dim:#b3aa9b;
    --moss:#8d9d90;
    --bamboo:#c2a878;
    --cinnabar:#a8422b;
    --glow:rgba(194,168,120,.075);
    --line:rgba(194,168,120,.2);
    --thread:rgba(194,168,120,.45);
    --slip-sheen:linear-gradient(90deg, rgba(0,0,0,.42), rgba(255,255,255,.03) 26%, rgba(255,255,255,.02) 62%, rgba(0,0,0,.46));
    --slip-a:#1d2622; --slip-b:#141c19; --slip-c:#101715;
    --void-bg:linear-gradient(180deg,#121917,#0f1513);
    --void-border:rgba(194,168,120,.34);
    --void-glyph:rgba(168,66,43,.8);
    --btn-ink:#12100c; --btn-bg:#c2a878; --btn-bg-h:#d3ba8c;
    --quiet-line:rgba(194,168,120,.35); --quiet-bg:rgba(194,168,120,.09);
    --serif:"Songti SC","Songti TC","Source Han Serif SC","Source Han Serif CN","Noto Serif SC","Noto Serif CJK SC","AR PL UMing CN","STSong","SimSun",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",system-ui,sans-serif;
  }
  [data-theme="light"]{
    color-scheme:light;
    --bg:#f3ede1;
    --ink:#1c2420;
    --dim:#4f5a53;
    --moss:#5a655d;
    --bamboo:#8a6836;
    --cinnabar:#9c3a24;
    --glow:rgba(170,128,62,.11);
    --line:rgba(120,92,48,.45);
    --thread:rgba(120,92,48,.45);
    --slip-sheen:linear-gradient(90deg, rgba(90,68,32,.16), rgba(255,255,255,.5) 26%, rgba(255,255,255,.34) 62%, rgba(90,68,32,.2));
    --slip-a:#e6d8b8; --slip-b:#d9c8a3; --slip-c:#cdba95;
    --void-bg:linear-gradient(180deg,#efe6d3,#e7dcc4);
    --void-border:rgba(120,92,48,.5);
    --void-glyph:rgba(156,58,36,.85);
    --btn-ink:#f7f1e4; --btn-bg:#8a6836; --btn-bg-h:#6f5228;
    --quiet-line:rgba(120,92,48,.4); --quiet-bg:rgba(120,92,48,.1);
  }
  *{box-sizing:border-box}
  .i18n-wait{visibility:hidden}
  body{
    margin:0;
    min-height:100svh;
    display:grid;
    place-items:center;
    padding:clamp(1.5rem,6vw,4rem);
    background:var(--bg);
    color:var(--ink);
    font-family:var(--serif);
    line-height:1.86;
    background-image:radial-gradient(130% 72% at 50% -14%, var(--glow), transparent 62%);
    background-repeat:no-repeat;
    transition:background-color .25s ease,color .25s ease;
  }
  a{color:var(--ink);text-decoration:none}
  :focus-visible{outline:2px solid var(--bamboo);outline-offset:3px}
  .box{max-width:34rem;text-align:center}
  .slips{
    list-style:none;display:flex;justify-content:center;gap:clamp(.35rem,1.2vw,.62rem);
    margin:0 0 2.2rem;padding:0;position:relative;
  }
  .slips::before,.slips::after{
    content:"";position:absolute;left:0;right:0;height:1px;z-index:2;
    background:linear-gradient(90deg,transparent,var(--thread) 12%,var(--thread) 88%,transparent);
  }
  .slips::before{top:22%}
  .slips::after{top:74%}
  .slip{
    position:relative;width:clamp(2.9rem,10vw,4.2rem);height:clamp(8.6rem,28vw,12rem);
    background:var(--slip-sheen),linear-gradient(180deg,var(--slip-a),var(--slip-b) 46%,var(--slip-c));
    border:1px solid var(--line);border-radius:2px;
    transition:background .25s ease,border-color .25s ease;
  }
  .slip--void{
    display:grid;place-items:center;
    border-style:dashed;border-color:var(--void-border);
    background:var(--void-bg);
  }
  .slip--void span{font-family:var(--serif);font-size:clamp(1.2rem,4vw,1.6rem);color:var(--void-glyph)}
  .code{
    margin:0;
    font-family:var(--sans);
    font-size:.74rem;letter-spacing:.4em;text-indent:.4em;color:var(--bamboo);
  }
  h1{
    margin:.7rem 0 0;font-size:clamp(1.25rem,4.4vw,1.6rem);font-weight:400;letter-spacing:.05em;
  }
  p.lede{margin:1rem auto 0;max-width:27rem;color:var(--moss);font-size:.95rem}
  .acts{margin:2rem 0 0;display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
  .btn{
    display:inline-block;padding:.6rem 1.15rem;font-family:var(--sans);font-size:.85rem;
    color:var(--btn-ink);background:var(--btn-bg);border:1px solid var(--btn-bg);border-radius:1px;
    transition:background-color .22s ease,border-color .22s ease,color .22s ease;
  }
  .btn:hover,.btn:focus-visible{background:var(--btn-bg-h);border-color:var(--btn-bg-h);color:var(--btn-ink)}
  .btn--quiet{color:var(--dim);background:transparent;border-color:var(--quiet-line)}
  .btn--quiet:hover,.btn--quiet:focus-visible{color:var(--ink);background:var(--quiet-bg);border-color:var(--bamboo)}
  .foot{margin:2.4rem 0 0;font-family:var(--sans);font-size:.75rem;color:var(--dim)}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.001ms !important}}
</style>
</head>
<body>
  <main class="box">
    <ul class="slips" aria-hidden="true">
      <li class="slip"></li>
      <li class="slip"></li>
      <li class="slip slip--void"><span>缺</span></li>
      <li class="slip"></li>
    </ul>
    <p class="code">404</p>
    <h1 data-i18n="nf.title">这一片是空的，页面不在这里</h1>
    <p class="lede" data-i18n="nf.lede">地址可能打错了，也可能是旧链接。四个项目、做事方式和构建记录都还在首页上。</p>
    <div class="acts">
      <a class="btn" href="/" data-i18n="nf.home">回首页</a>
      <a class="btn btn--quiet" href="https://github.com/nightglean" data-i18n="nf.org">去组织页</a>
    </div>
    <p class="foot" data-i18n="nf.foot">长夜拾星 · 二〇二六</p>
  </main>
<script>
(function(){
  var dict={
    zh:{},
    tw:{
      'nf.title':'這一片是空的，頁面不在這裡',
      'nf.lede':'位址可能打錯了，也可能是舊連結。四個專案、做事方式和建構紀錄都還在首頁上。',
      'nf.home':'回首頁',
      'nf.org':'去組織頁',
      'nf.foot':'長夜拾星 · 二〇二六',
      '@title':'沒有這一頁 · 長夜拾星'
    },
    en:{
      'nf.title':'This slip is blank — the page is not here',
      'nf.lede':'The address may be mistyped, or the link is old. The four projects, how the work gets done, and the build log are all still on the home page.',
      'nf.home':'Back to home',
      'nf.org':'Organization',
      'nf.foot':'Nightglean · 2026',
      '@title':'Page not found · Nightglean'
    }
  };
  var d=document.documentElement;
  var lang=d.getAttribute('data-lang')||'zh';
  var pack=dict[lang]||{};
  var base={};
  [].slice.call(document.querySelectorAll('[data-i18n]')).forEach(function(el){
    var k=el.getAttribute('data-i18n');
    base[k]=el.innerHTML;
    if(pack[k]!==undefined) el.innerHTML=pack[k];
  });
  base['@title']=document.title;
  document.title=pack['@title']||base['@title'];
  var mc=document.querySelector('meta[name="theme-color"]');
  if(mc) mc.setAttribute('content', d.getAttribute('data-theme')==='light'?'#f3ede1':'#0c1210');
  d.classList.remove('i18n-wait');
})();
</script>
</body>
</html>
